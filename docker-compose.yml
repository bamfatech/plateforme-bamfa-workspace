services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bamfa}
      POSTGRES_USER: ${POSTGRES_USER:-bamfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bamfa}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bamfa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Boîte email de développement (capture les mails, ne les délivre pas).
  # UI : http://localhost:8025 · SMTP : mailpit:1025. Usage DEV uniquement (prod = Brevo).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
    volumes:
      - mailpit_data:/data

  # API Django (dev). Le code est monté en volume pour le rechargement à chaud.
  web:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment: &backend_env
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-bamfa}
      POSTGRES_USER: ${POSTGRES_USER:-bamfa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bamfa}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Async réel en conteneur (le worker traite la file).
      CELERY_TASK_ALWAYS_EAGER: "False"
      # Email de dev via Mailpit (SMTP).
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      EMAIL_USE_TLS: "False"
      DEFAULT_FROM_EMAIL: BAMFA <no-reply@bamfa.org>
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  # Worker Celery (tâches asynchrones : emails de masse, campagnes, exports…).
  worker:
    build: ./backend
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    environment:
      <<: *backend_env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
